[package]
name = "pallet-orbis-dotns-runtime-api"
description = "Stable bounded runtime API types for the native Orbis DotNS pallet"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bounded-collections = { workspace = true }
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-decode = { version = "0.16", default-features = false, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }
sp-api = { workspace = true }

[features]
default = ["std"]
std = [
	"bounded-collections/std",
	"codec/std",
	"scale-info/std",
	"sp-api/std",
]
