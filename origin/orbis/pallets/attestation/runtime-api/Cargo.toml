[package]
name = "pallet-orbis-attestation-runtime-api"
description = "Stable bounded runtime API types for the native Orbis attestation pallet"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bounded-collections = { workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-decode = { version = "0.16", default-features = false, features = ["derive"] }
scale-info = { features = ["derive"], workspace = true }
sp-api = { workspace = true }

[features]
default = ["std"]
std = [
	"bounded-collections/std",
	"codec/std",
	"scale-info/std",
	"sp-api/std",
]
