[package]
name = "pallet-orbis-transaction-storage-runtime-api"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Runtime API for Orbis transaction storage."

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
orbis-transaction-storage-primitives = { workspace = true }
codec = { workspace = true }
scale-decode = { version = "0.16", default-features = false, features = ["derive"] }
scale-info = { features = ["derive"], workspace = true }
sp-api = { workspace = true }

[features]
default = ["std"]
std = [
	"orbis-transaction-storage-primitives/std",
	"codec/std",
	"scale-info/std",
	"sp-api/std",
]
