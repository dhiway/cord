[package]
name = "origin-orbis-runtime"
description = "Orbis Enterprise Parachain Runtime"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
enumflags2 = { workspace = true }
serde = { optional = true, features = ["derive"], workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
hex-literal = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { features = ["alloc"], workspace = true }

# Local
origin-primitives = { workspace = true }
origin-runtime-constants = { workspace = true }
origin-hub-system-runtime-constants = { workspace = true }
token-origin-hub-runtime-api = { workspace = true }

# Substrate
frame-benchmarking = { optional = true, workspace = true }
frame-executive = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-try-runtime = { optional = true, workspace = true }
pallet-aura = { workspace = true }
pallet-authorship = { workspace = true }
pallet-assets = { workspace = true }
pallet-assets-precompiles = { workspace = true }
pallet-balances = { workspace = true }
pallet-broker = { workspace = true }
pallet-bulletin-hop-promotion = { workspace = true }
pallet-bulletin-transaction-storage = { workspace = true }
pallet-bulletin-transaction-storage-runtime-api = { workspace = true }
pallet-cord-identity = { workspace = true }
pallet-entity = { workspace = true }
pallet-register = { workspace = true }
pallet-revive = { workspace = true }
pallet-token = { workspace = true }
pallet-indices = { workspace = true }
pallet-scheduler = { workspace = true }
pallet-sudo = { workspace = true }
pallet-safe-mode = { workspace = true }
pallet-tx-pause = { workspace = true }
pallet-meta-tx = { workspace = true }
pallet-verify-signature = { workspace = true }
pallet-feeless = { workspace = true }
pallet-skip-feeless-payment = { workspace = true }
pallet-remark = { workspace = true }
pallet-message-queue = { workspace = true }
pallet-migrations = { workspace = true }
pallet-multisig = { workspace = true }
pallet-proxy = { workspace = true }
pallet-session = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-utility = { workspace = true }
polkadot-primitives = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-core = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-hop = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { workspace = true }
sp-session = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-transaction-storage-proof = { workspace = true }
sp-version = { workspace = true }

# Polkadot
pallet-xcm = { workspace = true }
pallet-xcm-benchmarks = { optional = true, workspace = true }
polkadot-parachain-primitives = { workspace = true }
polkadot-runtime-common = { workspace = true }
xcm = { workspace = true }
xcm-builder = { workspace = true }
xcm-executor = { workspace = true }
xcm-runtime-apis = { workspace = true }

# Cumulus
cumulus-primitives-aura = { workspace = true }
cumulus-pallet-aura-ext = { workspace = true }
cumulus-pallet-parachain-system = { workspace = true }
cumulus-pallet-session-benchmarking = { workspace = true }
cumulus-pallet-weight-reclaim = { workspace = true }
