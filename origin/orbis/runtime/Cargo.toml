[package]
name = "origin-commons-runtime"
description = "Orbis Commons enterprise parachain runtime"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
arrayvec = { workspace = true }
assets-common = { workspace = true }
orbis-pallets-common = { workspace = true }
enumflags2 = { workspace = true }
serde = { optional = true, features = ["derive"], workspace = true }
codec = { features = ["derive", "max-encoded-len"], workspace = true }
hex-literal = { workspace = true }
log = { workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { features = ["alloc"], workspace = true }

# Local
origin-primitives = { workspace = true }
origin-runtime-constants = { workspace = true }
