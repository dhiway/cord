[package]
name = "pallet-origin-entity"
description = "Origin stack entity management pallet."
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
origin-primitives = { default-features = false, workspace = true }
enumflags2 = { workspace = true }
scale-info = { features = ["derive", "serde"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-origin-feeless = { workspace = true }
pallet-origin-token = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { default-features = true, workspace = true }
sp-keystore = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-core = { default-features = true, workspace = true }

[features]
default = ["std"]

std = [
	"codec/std",
	"origin-primitives/std",
	"enumflags2/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-origin-feeless/std",
	"pallet-origin-token/std",
	"scale-info/std",
	"sp-io/std",
	"sp-keystore/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
