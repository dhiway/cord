[package]
name = 'cord-orb-runtime'
description = "Orb runtime implementation."
version.workspace = true
authors.workspace = true
build = 'build.rs'
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
serde_json = { features = ["alloc"], workspace = true }
log = { workspace = true }

cord-primitives = { workspace = true }
cord-orb-runtime-constants = { workspace = true }
cord-runtime-common = { workspace = true }

# Substrate
sp-authority-discovery = { workspace = true }
sp-consensus-babe = {  workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-api = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = {  workspace = true }
sp-staking = {  workspace = true }
sp-core = {  workspace = true }
sp-io = { workspace = true }
sp-keyring = { workspace = true }
sp-session = { workspace = true }
sp-storage = { workspace = true }
sp-version = {  workspace = true }
sp-transaction-pool = { workspace = true }
sp-block-builder = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-statement-store = { workspace = true }

pallet-authorities = { workspace = true }
pallet-authority-discovery = { workspace = true }
pallet-authorship = { workspace = true }
pallet-babe = { workspace = true }
pallet-balances = { workspace = true }
frame-executive = { workspace = true }
pallet-entity = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-indices = { workspace = true }
pallet-meta-tx = { workspace = true }
pallet-migrations = { workspace = true }
pallet-multisig = { workspace = true }
pallet-offences = { workspace = true }
pallet-preimage = { workspace = true }
pallet-proxy = { workspace = true }
pallet-register = { workspace = true }
pallet-remark = { workspace = true }
pallet-runtime-upgrade = { workspace = true }
pallet-safe-mode = { workspace = true }
pallet-scheduler = { workspace = true }
pallet-session = { features = ["historical"], workspace = true }
pallet-statement = { workspace = true }
pallet-token = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-tx-pause = { workspace = true }
pallet-sudo = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-metadata-hash-extension = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-utility = { workspace = true }
pallet-verify-signature = { workspace = true }
hex-literal = { workspace = true, optional = true }

frame-benchmarking = { workspace = true, optional = true }
frame-system-benchmarking = { workspace = true, optional = true }
frame-try-runtime = { workspace = true, optional = true }
pallet-offences-benchmarking = { optional = true, workspace = true }
pallet-session-benchmarking = { optional = true, workspace = true }

[dev-dependencies]
sp-staking = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true, default-features = true }

[features]
default = ['std']
std = [
	"sp-authority-discovery/std",
	"cord-primitives/std",
	"cord-runtime-common/std",
	"frame-system-benchmarking?/std",
	"frame-metadata-hash-extension/std",
	"codec/std",
	"scale-info/std",
	"serde_json/std",
	"sp-inherents/std",
	"sp-core/std",
	"sp-api/std",
	"sp-transaction-pool/std",
	"sp-block-builder/std",
	"sp-offchain/std",
	"sp-statement-store/std",
	"frame-support/std",
	"frame-benchmarking/std",
	"frame-executive/std",
	"pallet-authorities/std",
	"pallet-authority-discovery/std",
	"pallet-authorship/std",
	"pallet-balances/std",
	"pallet-entity/std",
	"pallet-grandpa/std",
	"pallet-token/std",
	"pallet-tx-pause/std",
	"pallet-indices/std",
	"pallet-meta-tx/std",
	"pallet-migrations/std",
	"pallet-multisig/std",
	"pallet-offences-benchmarking?/std",
	"pallet-offences/std",
	"pallet-preimage/std",
	"pallet-proxy/std",
	"pallet-register/std",
	"pallet-safe-mode/std",
	"pallet-scheduler/std",
	"pallet-session-benchmarking?/std",
	"pallet-session/std",
	"pallet-statement/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"pallet-sudo/std",
	"pallet-timestamp/std",
	"pallet-utility/std",
	"pallet-babe/std",
	"pallet-remark/std",
	"pallet-runtime-upgrade/std",
	"pallet-verify-signature/std",
	"sp-runtime/std",
	"sp-staking/std",
	"frame-system/std",
	"frame-system-rpc-runtime-api/std",
	"sp-version/std",
	"log/std",
	"sp-consensus-babe/std",
	"sp-consensus-grandpa/std",
	"sp-genesis-builder/std",
	"sp-session/std",
	"sp-storage/std",
	"cord-orb-runtime-constants/std",
	"substrate-wasm-builder",
	"frame-try-runtime?/std",
	"sp-io/std",
]
# Internal runtime API (with default disabled)
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"cord-runtime-common/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"sp-staking/runtime-benchmarks",
	"pallet-babe/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-entity/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"pallet-indices/runtime-benchmarks",
	"pallet-meta-tx/runtime-benchmarks",
	"pallet-migrations/runtime-benchmarks",
	"pallet-multisig/runtime-benchmarks",
	"pallet-offences-benchmarking/runtime-benchmarks",
	"pallet-offences/runtime-benchmarks",
	"pallet-preimage/runtime-benchmarks",
	"pallet-proxy/runtime-benchmarks",
	"pallet-register/runtime-benchmarks",
	"pallet-safe-mode/runtime-benchmarks",
	"pallet-remark/runtime-benchmarks",
	"pallet-scheduler/runtime-benchmarks",
	"pallet-session-benchmarking/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-tx-pause/runtime-benchmarks",
	"pallet-utility/runtime-benchmarks",
	"pallet-verify-signature/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pallet-authorities/runtime-benchmarks",
]

try-runtime = [
	"frame-executive/try-runtime",
	"frame-try-runtime",
	"frame-system/try-runtime",
	"frame-support/try-runtime",
	"pallet-authorities/try-runtime",
	"pallet-authority-discovery/try-runtime",
	"pallet-authorship/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-entity/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-indices/try-runtime",
	"pallet-meta-tx/try-runtime",
	"pallet-migrations/try-runtime",
	"pallet-multisig/try-runtime",
	"pallet-offences/try-runtime",
	"pallet-preimage/try-runtime",
	"pallet-proxy/try-runtime",
	"pallet-register/try-runtime",
	"pallet-safe-mode/try-runtime",
	"pallet-scheduler/try-runtime",
	"pallet-session/try-runtime",
	"pallet-sudo/try-runtime",
	"pallet-token/try-runtime",
	"pallet-tx-pause/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"pallet-utility/try-runtime",
	"pallet-verify-signature/try-runtime",
	"pallet-babe/try-runtime",
	"pallet-runtime-upgrade/try-runtime",
	"pallet-remark/try-runtime",
	"frame-try-runtime/try-runtime",
	"sp-runtime/try-runtime",
]


# Set timing constants (e.g. session period) to faster versions to speed up testing.
fast-runtime = ["cord-orb-runtime-constants/fast-runtime"]

# A feature that should be enabled when the runtime should be build for on-chain
# deployment. This will disable stuff that shouldn't be part of the on-chain wasm
# to make it smaller like logging for example.
on-chain-release-build = ["metadata-hash", "sp-api/disable-logging"]

metadata-hash = ["substrate-wasm-builder/metadata-hash"]
