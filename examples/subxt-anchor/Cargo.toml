[package]
name = "cord-subxt-anchor"
edition = "2021"
version = "0.1.0"
description = "Subxt-powered walkthrough that anchors CORD extrinsics on a local chain."
license = "GPL-3.0-or-later"
authors = ["Dhiway Networks <info@dhiway.com>"]
readme = "README.md"
keywords = ["cord", "subxt", "examples", "extrinsics"]

[dependencies]
clap = { workspace = true, features = ["derive"], default-features = true }
color-eyre = { version = "0.6.3" }
comfy-table = { workspace = true, default-features = true }
cord-primitives = { path = "../../primitives/cord", features = ["std"] }
hex = { workspace = true }
codec = { workspace = true, default-features = true }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
subxt = { version = "0.44", default-features = true, features = ["jsonrpsee", "native"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = { version = "2.5", features = ["serde"] }
rand = { version = "0.8", features = ["std"] }
scale-info = { workspace = true, features = ["std"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["cli"]
cli = []
