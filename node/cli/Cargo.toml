pallet-staking = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, features = [
	"unprefixed_malloc_on_supported_platforms",
] }

[dev-dependencies]
futures = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
nix = { features = ["signal"], workspace = true }
regex = { workspace = true }
soketto = { workspace = true }
criterion = { features = [
	"async_tokio",
], workspace = true, default-features = true }
tokio = { features = [
	"macros",
	"parking_lot",
	"time",
], workspace = true, default-features = true }
tokio-util = { features = ["compat"], workspace = true }
wait-timeout = { workspace = true }
wat = { workspace = true }
serde_json = { workspace = true, default-features = true }
scale-info = { features = [
	"derive",
	"serde",
], workspace = true, default-features = true }
sp-keyring = { workspace = true }
pretty_assertions.workspace = true
env_logger = { workspace = true }
assert_matches = { workspace = true }
sc-keystore = { workspace = true }
sc-client-db = { workspace = true }
sc-consensus = { workspace = true }
sc-consensus-babe = { workspace = true }
sc-consensus-epochs = { workspace = true }
sp-tracing = { workspace = true }
sp-blockchain = { workspace = true }
sp-crypto-hashing = { workspace = true }
cord-cli-test-utils = { workspace = true }
frame-support = { workspace = true }
cord-node-testing = { workspace = true }
pallet-balances = { workspace = true }
pallet-root-testing = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-sudo = { workspace = true }
sp-consensus-babe = { workspace = true }
sp-externalities = { workspace = true }
sp-runtime = { workspace = true }
sp-trie = { workspace = true }
sp-state-machine = { workspace = true }
sp-application-crypto = { workspace = true }

[build-dependencies]
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
cord-node-inspect = { workspace = true, optional = true, default-features = true }
frame-benchmarking-cli = { workspace = true, optional = true, default-features = true }
sc-cli = { workspace = true, optional = true, default-features = true }
sc-service = { workspace = true, optional = true, default-features = true }
sc-tracing = { workspace = true, optional = true, default-features = true }
sc-storage-monitor = { workspace = true, optional = true, default-features = true }
substrate-build-script-utils = { workspace = true, optional = true, default-features = true }

[features]
default = ["cli", "db", "orb-native"]

cli = [
	"clap",
	"clap_complete",
	"frame-benchmarking-cli",
	"sc-cli",
	"sc-service",
	"sc-tracing",
	"sc-storage-monitor",
	"cord-node-inspect",
	"substrate-build-script-utils",
]

db = ["sc-service/rocksdb"]

jemalloc-allocator = ["dep:tikv-jemallocator"]

orb-native = ["cord-orb-runtime", "cord-orb-runtime-constants"]

runtime-benchmarks = [
	"cord-runtime-common/runtime-benchmarks",
	"cord-orb-runtime/runtime-benchmarks",
	"frame-benchmarking-cli/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"cord-node-inspect/runtime-benchmarks",
	"sc-service/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]

try-runtime = [
	"frame-system/try-runtime",
	"frame-support/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"sp-runtime/try-runtime",
	"cord-orb-runtime/try-runtime",
]

fast-runtime = ["cord-orb-runtime/fast-runtime"]

# metadata-hash = ["cord-orb-runtime/metadata-hash"]
