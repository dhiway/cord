[patch.crates-io]
# Revive's std-only Subxt tooling requests the published crate. Keep it on the same Dhiway SDK
# source as the runtime graph instead of compiling a second `sp-crypto-hashing` source.
sp-crypto-hashing = { git = "https://github.com/dhiway/sdk", branch = "release-v1.24.0" }

[profile.release]
panic = 'unwind'
opt-level = 3

[profile.production]
codegen-units = 1
inherits = "release"
lto = true

[profile.dev]
split-debuginfo = "unpacked"

# make sure dev builds with backtrace do
# not slow us down
[profile.dev.package.backtrace]
inherits = "release"

[profile.testnet]
inherits = "release"
debug = 1               # debug symbols are useful for profilers
debug-assertions = true
overflow-checks = true

[profile.dev.package]
ark-vrf = { opt-level = 3 }
blake2 = { opt-level = 3 }
blake2b_simd = { opt-level = 3 }
chacha20poly1305 = { opt-level = 3 }
cranelift-codegen = { opt-level = 3 }
crc32fast = { opt-level = 3 }
crossbeam-deque = { opt-level = 3 }
crypto-mac = { opt-level = 3 }
curve25519-dalek = { opt-level = 3 }
ed25519-dalek = { opt-level = 3 }
futures-channel = { opt-level = 3 }
hash-db = { opt-level = 3 }
hashbrown = { opt-level = 3 }
hmac = { opt-level = 3 }
httparse = { opt-level = 3 }
integer-sqrt = { opt-level = 3 }
