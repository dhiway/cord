[workspace.package]
version = "0.9.9"
authors = ['Dhiway Networks <info@dhiway.com>']
edition = "2021"
homepage = "https://cord.network"
repository = "https://github.com/dhiway/cord"
license = "GPL-3.0"

[workspace]
resolver = "2"

members = [
	"node/cli",
	"node/rpc",
	"node/inspect",
	"node/testing",
	"origin/primitives",
	"origin/runtime-api/token-origin-runtime-api",
	"origin/runtime-api/token-origin-hub-runtime-api",
	"origin/base",
	"origin/base/cli",
	"origin/base/runtime",
	"origin/orbis/node",
	"origin/hub/constants",
	"origin/hub/system",
	"origin/orbis/runtime",
	"origin/common",
	"origin/pallets/authorities",
	"origin/orbis/pallets/common",
	"origin/orbis/pallets/hop-promotion",
	"origin/orbis/pallets/individuality-support",
	"origin/orbis/pallets/chunks-manager",
	"origin/orbis/pallets/members",
	"origin/orbis/pallets/members-notifier",
	"origin/orbis/pallets/people",
	"origin/orbis/pallets/people-lite",
	"origin/orbis/pallets/personhood",
	"origin/orbis/pallets/transaction-storage",
	"origin/orbis/pallets/transaction-storage/primitives",
	"origin/orbis/pallets/transaction-storage/runtime-api",
	"origin/pallets/token",
	"origin/pallets/entity",
	"origin/pallets/register",
	"origin/pallets/feeless",
	"pallets/collection",
	"pallets/doken",
	"pallets/identity",
	"pallets/network-membership",
	"pallets/node-authorization",
	"pallets/offences",
	"pallets/registry",
	"pallets/remote-proxy",
	"pallets/runtime-upgrade",
	"pallets/session-benchmarking",
	"pallets/profile",
	"pallets/entry",
	"primitives/cord",
	"primitives/network-membership",
	"runtimes/common",
	"runtimes/common/api/assets",
	"runtimes/common/api/doken",
	"runtimes/common/authorities",
	"runtimes/braid/",
	"runtimes/braid/constants",
	"runtimes/loom/",
	"runtimes/loom/constants",
	"runtimes/weave/",
	"runtimes/weave/constants",
	"test-utils/cli",
	# "pallets/remote-proxy",
	"pallets/runtime-upgrade",
	"primitives/cord",
	"test-utils/cli",
	"origin-rs",
]

default-members = ["node/cli", "origin/base", "origin/orbis/node", "origin-rs" ]

[workspace.lints.rust]
suspicious_double_ref_op = { level = "allow", priority = 2 }
unexpected_cfgs = { level = "warn", check-cfg = [
	'cfg(build_opt_level, values("3"))',
	'cfg(build_profile, values("debug", "release"))',
	'cfg(enable_alloc_error_handler)',
	'cfg(fuzzing)',
	'cfg(ignore_flaky_test)',
	'cfg(cord_runtime)',
] }

[workspace.lints.clippy]
all = { level = "allow", priority = 0 }
bind_instead_of_map = { level = "allow", priority = 2 }              # stylistic
borrowed-box = { level = "allow", priority = 2 }                     # Reasonable to fix this one
complexity = { level = "warn", priority = 1 }
correctness = { level = "warn", priority = 1 }
default_constructed_unit_structs = { level = "allow", priority = 2 } # stylistic
derivable_impls = { level = "allow", priority = 2 }                  # false positives
eq_op = { level = "allow", priority = 2 }                            # In tests we test equality.
erasing_op = { level = "allow", priority = 2 }                       # E.g. 0 * DOLLARS
extra-unused-type-parameters = { level = "allow", priority = 2 }     # stylistic
identity-op = { level = "allow", priority = 2 }                      # One case where we do 0 +
if-same-then-else = { level = "allow", priority = 2 }
needless-lifetimes = { level = "allow", priority = 2 }               # generated code
needless_option_as_deref = { level = "allow", priority = 2 }         # false positives
nonminimal-bool = { level = "allow", priority = 2 }                  # maybe
option-map-unit-fn = { level = "allow", priority = 2 }               # stylistic
stable_sort_primitive = { level = "allow", priority = 2 }            # prefer stable sort
too-many-arguments = { level = "allow", priority = 2 }               # (Turning this on would lead to)
type_complexity = { level = "allow", priority = 2 }                  # raison d'etre
unit_arg = { level = "allow", priority = 2 }                         # stylistic
unnecessary_cast = { level = "allow", priority = 2 }                 # Types may change
useless_conversion = { level = "allow", priority = 2 }               # Types may change
while_immutable_condition = { level = "allow", priority = 2 }        # false positives
zero-prefixed-literal = { level = "allow", priority = 2 }            # 00_1000_000

