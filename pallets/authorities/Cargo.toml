[package]
name = 'pallet-authorities'
description = "Cord Authority Manager."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
log = { workspace = true }

# Substrate dependencies
frame-system = { workspace = true }
frame-support = { workspace = true }
sp-runtime = { workspace = true }
sp-core = { workspace = true }
sp-staking = { workspace = true }
pallet-session = { features = ["historical"], workspace = true }
sp-io = { workspace = true, optional = true }
sp-state-machine = { workspace = true, optional = true }
pallet-balances = { workspace = true, optional = true }
frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
pallet-im-online = { workspace = true, default-features = true }

[features]
default = ['std']
std = [
	'codec/std',
	'scale-info/std',
	"frame-benchmarking?/std",
	'frame-system/std',
	'frame-support/std',
	'sp-runtime/std',
	'sp-core/std',
	'sp-staking/std',
	'pallet-session/std',
	'log/std',
	"serde/std",
	"sp-io",
	"sp-io/std",
	"sp-state-machine",
	"sp-state-machine/std",
	"pallet-balances",
	"pallet-balances/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"sp-staking/runtime-benchmarks",
	"sp-io",
	"sp-state-machine",
	"pallet-balances",
]

try-runtime = [
	'frame-support/try-runtime',
	"frame-system/try-runtime",
	"pallet-session/try-runtime",
	"sp-runtime/try-runtime",
]
