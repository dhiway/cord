[package]
name = 'pallet-entry'
description = 'Pallet to Create and Manage Registry Entry. This is based on the CORD URI version'
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ['x86_64-unknown-linux-gnu']

[dev-dependencies]
sp-keystore = { features = ["std"], workspace = true }

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
bitflags = { workspace = true }

# Internal dependencies
cord-primitives = { workspace = true }
pallet-doken = { workspace = true }
pallet-profile = { workspace = true }
pallet-registry = { workspace = true }

# Substrate dependencies
frame-benchmarking = { optional = true, workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-core = { optional = true, workspace = true }
sp-io = { optional = true, workspace = true }
sp-keystore = { optional = true, workspace = true }
sp-runtime = { workspace = true }

[lib]
doctest = false

[features]
default = ['std']
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-profile/runtime-benchmarks",
	"pallet-registry/runtime-benchmarks",
]
std = [
	"codec/std",
	"frame-benchmarking/std",
	"frame-support/std",
	"frame-system/std",
	"cord-primitives/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-keystore/std",
	"sp-runtime/std",
	"pallet-doken/std",
	"pallet-profile/std",
	"pallet-registry/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
	"pallet-profile/try-runtime",
	"pallet-registry/try-runtime",
]
