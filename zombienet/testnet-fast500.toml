# Build (fast runtime for 500ms blocks):
#   cargo build -p origin-orbis -p origin-orbis-runtime --release --features fast-runtime
# Launch:
#   zombienet -p native spawn zombienet/testnet-fast500.toml

[settings]
timeout = 300

[relaychain]
chain = "origin-local"
default_command = "target/release/origin"

[relaychain.genesis.runtimeGenesis.patch.configuration.config.async_backing_params]
max_candidate_depth = 6
allowed_ancestry_len = 2

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
max_validators_per_core = 1
num_cores = 4
lookahead = 3

[[relaychain.nodes]]
name = "alice"
rpc_port = 9801
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "bob"
rpc_port = 9802
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "charlie"
rpc_port = 9803
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "dave"
rpc_port = 9804
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "eve"
rpc_port = 9805
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "fredie"
rpc_port = 9806
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[parachains]]
id = 1006
addToGenesis = true
cumulus_based = true
chain = "orbis-local"

[[parachains.collators]]
name = "orbis-alice"
rpc_port = 9810
collator = true
command = "target/release/origin-orbis"
args = ["--alice", "--execution=wasm", "--force-authoring", "--authoring=slot-based"]

[[parachains.collators]]
name = "orbis-bob"
rpc_port = 9811
collator = true
command = "target/release/origin-orbis"
args = ["--bob", "--execution=wasm", "--force-authoring", "--authoring=slot-based"]
