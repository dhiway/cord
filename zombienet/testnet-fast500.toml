# Build (fast runtime for 500ms blocks):
#   cargo build -p origin-hub -p origin-hub-system-runtime --release --features fast-runtime
# Launch:
#   zombienet -p native spawn testnet-fast500.toml

[settings]
timeout = 300

[relaychain]
chain = "origin-local"
default_command = "../target/release/origin"

[relaychain.genesis.runtimeGenesis.patch.configuration.config.async_backing_params]
max_candidate_depth = 6
allowed_ancestry_len = 2

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
max_validators_per_core = 1
num_cores = 3
lookahead = 3

[[relaychain.nodes]]
name = "alice"
rpc_port = 9801
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "bob"
rpc_port = 9802
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "charlie"
rpc_port = 9803
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "dave"
rpc_port = 9804
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "eve"
rpc_port = 9805
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
