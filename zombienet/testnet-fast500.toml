[[parachains]]
id = 1000
addToGenesis = true
cumulus_based = true
chain = "origin-system-local"

[parachains.collator]
name = "hub-fast"
rpc_port = 9810
collator = true
command = "../target/release/origin-hub"
args = ["--execution=wasm", "--force-authoring"]
