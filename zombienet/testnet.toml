# Build pieces:
#   cargo build -p origin-orbis -p origin-orbis-runtime --release
# Launch network:
#   zombienet -p native spawn zombienet/testnet.toml

[settings]
timeout = 300

[relaychain]
chain = "origin-local"
default_command = "target/release/origin"

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
max_validators_per_core = 1
num_cores = 4
lookahead = 3

[[relaychain.nodes]]
name = "alice"
rpc_port = 9900
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[relaychain.nodes]]
name = "bob"
rpc_port = 9901
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[relaychain.nodes]]
name = "charlie"
rpc_port = 9902
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[parachains]]
id = 1006
addToGenesis = true
cumulus_based = true
chain = "orbis-local"

[[parachains.collators]]
name = "orbis-alice"
rpc_port = 9910
collator = true
command = "target/release/origin-orbis"
args = ["--alice", "--trie-cache-size=0", "--execution=wasm", "--authoring=slot-based"]

[[parachains.collators]]
name = "orbis-bob"
rpc_port = 9911
collator = true
command = "target/release/origin-orbis"
args = ["--bob", "--trie-cache-size=0", "--execution=wasm", "--authoring=slot-based"]
