# Build pieces:
#   cargo build -p origin-orbis -p origin-orbis-runtime --release
# Launch network:
#   zombienet -p native spawn zombienet/testnet.toml

[settings]
timeout = 300

[relaychain]
chain = "origin-local"
default_command = "target/release/origin"

[[relaychain.nodes]]
name = "alice"
rpc_port = 9900
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[relaychain.nodes]]
name = "bob"
rpc_port = 9901
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[relaychain.nodes]]
name = "charlie"
rpc_port = 9902
validator = true
args = [
	"--trie-cache-size=0",
	"--disable-worker-version-check",
	"--execution=wasm",
]

[[parachains]]
id = 1006
addToGenesis = true
cumulus_based = true
chain = "orbis-local"

[parachains.collator]
name = "orbis-collator"
rpc_port = 9910
collator = true
command = "target/release/origin-orbis"
args = ["--trie-cache-size=0", "--execution=wasm"]
