# Build the production-shaped 3-core elastic runtime:
#   cargo build -p origin-orbis -p origin-orbis-runtime --release
# Launch:
#   zombienet -p native spawn zombienet/testnet-elastic.toml
# In a second terminal, assign cores and verify progress/finality:
#   cargo run -p origin-rs --example bootstrap_orbis_core -- --endpoint ws://127.0.0.1:9801 --cores 3
#   python3 zombienet/orbis_smoke.py --relay http://127.0.0.1:9801 --orbis http://127.0.0.1:9810 --expected-cores 3 --expected-block-rate 3

[settings]
timeout = 300

[relaychain]
chain = "origin-local"
default_command = "target/release/origin"

[relaychain.genesis.runtimeGenesis.patch.configuration.config.async_backing_params]
allowed_ancestry_len = 6
max_candidate_depth = 6

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
max_validators_per_core = 1
num_cores = 3
lookahead = 3

[[relaychain.nodes]]
name = "alice"
rpc_port = 9801
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "bob"
rpc_port = 9802
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "charlie"
rpc_port = 9803
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "dave"
rpc_port = 9804
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "eve"
rpc_port = 9805
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[relaychain.nodes]]
name = "fredie"
rpc_port = 9806
validator = true
args = [
  "--trie-cache-size=0",
  "--disable-worker-version-check",
  "--execution=wasm",
]

[[parachains]]
id = 1006
addToGenesis = true
cumulus_based = true
chain = "orbis-local"
num_cores = 3

[[parachains.collators]]
name = "orbis-alice"
rpc_port = 9810
collator = true
command = "target/release/origin-orbis"
args = ["--alice", "--execution=wasm", "--force-authoring", "--authoring=slot-based"]

[[parachains.collators]]
name = "orbis-bob"
rpc_port = 9811
collator = true
command = "target/release/origin-orbis"
args = ["--bob", "--execution=wasm", "--force-authoring", "--authoring=slot-based"]
