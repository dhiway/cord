version = 1
p0_gate = "ready-for-ledger-ratification"

[[decision]]
id = "P0-DERIVED-GATE-001"
status = "resolved-derived-gate"
subject = "Commitment SCALE portable type IDs"
contract = "storage-checkpoints-v2.md"
resolution = "P0 freezes stable logical SCALE names, exact layouts, signature domain/digest and cross-language vectors. Portable numeric IDs are generated properties of the complete implementing runtime metadata and cannot exist before P1. P1 must emit logical-name-to-portable-ID plus metadata hash and fail closed on absence/drift before checkpoint dispatch; P3 repeats the binding in product descriptors."
implementation_may_start = true

[[decision]]
id = "P0-RESOLUTION-002"
status = "resolved"
subject = "Retired Identity set capacity error"
contract = "origin-host-registry-v2.errors.json"
resolution = "Assigned non-conflicting non-retryable code 411 IDENTITY_RETIRED_SET_FULL in E_IDENTITY; CDDL, operations, schemas and vectors bind it."
implementation_may_start = true

[[decision]]
id = "P0-INTERPRETATION-003"
status = "resolved-by-normative-registry"
subject = "Large GET result versus 4 MiB frame maximum"
contract = "origin-host-registry-v2.cddl"
resolution = "Typed object/S3 GET and range byte chunks are Progress events bounded to 4 MiB; terminal Result carries verified CID, length/range and checkpoint metadata. This preserves 64 MiB objects without violating frame bounds."
implementation_may_start = true

[[decision]]
id = "P0-RESOLUTION-004"
status = "resolved"
subject = "Encryption nonce-reuse error"
contract = "origin-host-registry-v2.errors.json"
resolution = "Assigned non-conflicting non-retryable code 211 ENCRYPTION_NONCE_REUSE in E_CONTENT; affected content operations, CDDL, schemas and vectors bind it."
implementation_may_start = true
