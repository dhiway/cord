outbox_transitions = [
  "Prepared|network_send|SentAdvisory|none",
  "Prepared|authenticated_response|ResponseInstalled|atomic_install_response_successor_cursor",
  "SentAdvisory|authenticated_response|ResponseInstalled|atomic_install_response_successor_cursor",
  "SentAdvisory|transport_loss|Prepared|resend_byte_identical_record",
  "ResponseInstalled|provider_ack_confirmed|AckConfirmed|persist_ack_and_retire_consumed_authority",
  "AckConfirmed|gc|GC|erase_body_keep_bounded_tombstone",
  "Prepared|recovery_window_closed|Expired|erase_authority_keep_tombstone",
  "ResponseInstalled|recovery_window_closed|Expired|erase_authority_keep_tombstone",
  "Prepared|integrity_failure|Quarantined|send_nothing_require_user_recovery",
  "ResponseInstalled|integrity_failure|Quarantined|send_nothing_require_user_recovery",
]

[expectations.host_outbox_errors]
