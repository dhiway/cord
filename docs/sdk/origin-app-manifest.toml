schema_version = 1
manifest_schema = "cord.origin.app-manifest"
manifest_version = 1
package = "@cord-network/origin-sdk-apps"
production_ready = false

[authority]
name_owner = "Commons Names"
manifest_commitment = "Commons retained content hash"
live_attestation = "Commons Names resolver"
search_ranking = "reconstructible off-chain index"
registry_contract = false
deployment_contract = false

[resolution]
finalized_snapshot = true
reads = ["NamesApi.name_status", "NamesApi.name_by_id", "NamesApi.resolve_content", "NamesApi.resolve_attestation"]
content_integrity = "blake2b-256 commitment plus CID declaration"
sandbox_isolation = "product-origin"

[deployment]
default_bundle = "origin-static-v1"
deterministic_file_order = true
incremental_block_upload = true
native_storage = "StorageProvider.register_manifest plus Drive.update_root"
binding_after_storage_finality = true
car_unixfs = "injected-audited-packager-interface"

[discovery]
schema = "cord.origin.app-index.v1"
authority = false
reconstructible = true
search_results_revalidate_native_name = true
search_results_revalidate_manifest_commitment = true
ownership_records = false

[bounds]
manifest_bytes = 65536
entrypoint_bytes = 256
channel_bytes = 32
