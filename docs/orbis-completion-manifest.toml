[[protocol_invariant]]
id = "INV-capacity-sum"
formula = "ReservedPermanentCapacity == sum(active ResourceReservations.bytes_remaining)"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-global-permanent-cap"
formula = "PermanentStorageUsed + ReservedPermanentCapacity <= MaxPermanentStorageSize"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-active-tombstone-bound"
formula = "count(active ResourceReservations) + count(ResourceReservationTombstones) <= MaxReservations"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-claim-bound"
formula = "count(Resources.StorageClaims) <= MaxReservations"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-purpose-bijection"
formula = "each StorageClaim has exactly one matching StorageReservationByPurpose entry until synchronous tombstone prune"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-expiry-order"
formula = "ResourceReservationExpiryBlocks strictly ascending; each bucket strictly ascending unique ReservationId"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-prune-queue"
formula = "each tombstone ID appears exactly once in sorted TombstonePruneQueue; skipped rows are retained for revisit"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-current-link-ref"
formula = "ResourceLinkByRef maps only the current ResourceReservationLinks ref; renew replaces the reverse pointer"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-provenance-lifetime"
formula = "StoredBy[BulletinRef] exists exactly while the matching TransactionInfo/proof-retention record exists; V5 absence means LegacyUnknown"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-isolated-consumption"
formula = "store_reserved or renew_reserved consumes bytes and one transaction from only its ReservationId; no aggregate account authorization"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-overlap-accounting"
formula = "manual renewal charges actual size again; old and new copies both count in PermanentStorageUsed until normal retention cleanup"
owner = "slice-1"

[[protocol_invariant]]
id = "INV-host-boundary"
formula = "all fallible checks and cross-pallet/provider preflights precede the host call; host index/renew is last; no fallible work follows"
owner = "slice-1"

