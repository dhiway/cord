contract = "AsPerson, PeopleLiteAuth, AsResources, AuthorizeCall"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-defaults"
name = "default constructor"
contract = "AsResources::<Runtime>::new(None) for normal, Ethereum, MetaTx and authorized construction"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-version"
name = "signed payload version"
contract = "bump spec_version and transaction_version 4 -> 5 in Slice 1"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-metadata"
name = "extension metadata"
contract = "normal and MetaTx vectors place AsResources before AuthorizeCall"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-signing"
name = "signing vectors"
contract = "update positive and negative compatibility vectors for transaction version 5"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-direct-meta"
name = "direct and MetaTx parity"
contract = "positive and negative resource proof tests on both surfaces"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-ethereum"
name = "Ethereum anti-spoof"
contract = "prove default EthExtra construction cannot claim Resources origin"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-AsResources-authorized"
name = "authorized construction"
contract = "authorized/offchain constructor defaults AsResources to None"
owner = "slice-1"

[[protocol_obligation]]
id = "P0-ReservedStorage-validation"
name = "ValidateStorageCalls reserved variants"
contract = "direct calls 10/11 classify ReservedStore/ReservedRenew; opaque/nested paths reject; calls are never feeless/PGAS"
owner = "slice-1"

[[protocol_dependency]]
id = "DEP-Slice3-ProofOfInk"
owner = "slice-3"
consumer = "slice-3"
requires = "Resources TwoPhaseStorage with ReservationPurpose::ProofOfInk and Bulletin store_reserved"
contract = "Resources remains sole ID allocator; real content is permanently charged only at Bulletin finalization"

[[protocol_dependency]]
id = "DEP-Slice10-Provider"
owner = "slice-10"
consumer = "slice-10"
requires = "Bulletin V6-to-V7 provider_ref migration"
contract = "backfill None with equality of IDs, purposes, owners, counters, hashes, refs, paid bytes and expiries"

[[protocol_dependency]]
id = "DEP-Slice14-UnifiedApp"
owner = "slice-14"
consumer = "slice-14"
requires = "complete Resources reservation and Bulletin reserved store/renew lifecycle"
contract = "capture exact ref/hash/Account(owner), assert capacity equations, provider attach, manual overlap renewal and cancel/expiry"

[[protocol_constant]]
id = "CONST-MaxReservations"
name = "MaxReservations"
value = 256
unit = "reservations"
owner = "slice-1"
policy = "conservative dev/test bound; production tuning requires a runtime upgrade and Architect/Critic manifest replan"

[[protocol_constant]]
id = "CONST-MaxReservationExpiryBlocks"
name = "MaxReservationExpiryBlocks"
value = 256
unit = "distinct-blocks"
owner = "slice-1"
policy = "at least MaxReservations so unique expiries remain representable; production tuning requires a runtime upgrade and Architect/Critic manifest replan"

[[protocol_constant]]
id = "CONST-MaxReservationsPerExpiryBlock"
name = "MaxReservationsPerExpiryBlock"
value = 256
unit = "reservations-per-block"
owner = "slice-1"
policy = "at least MaxReservations so a single expiry block remains representable; production tuning requires a runtime upgrade and Architect/Critic manifest replan"

[[protocol_constant]]
id = "CONST-MaxReservationLinks"
name = "MaxReservationLinks"
value = 1024
unit = "links"
owner = "slice-1"
policy = "four retained links per maximum reservation for dev/test; production tuning requires a runtime upgrade and Architect/Critic manifest replan"

[[protocol_constant]]
id = "CONST-TombstoneRetention"
name = "TombstoneRetention"
value = 100
unit = "blocks"
owner = "slice-1"
policy = "conservative dev/test audit window; production tuning requires a runtime upgrade and Architect/Critic manifest replan"
